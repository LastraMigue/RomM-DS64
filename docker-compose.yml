version: '3.8'

services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      # Reemplaza la ruta de la izquierda por la ruta local donde guardas tus carpetas de ROMs
      - /ruta/a/tus/roms:/romm/library
    depends_on:
      - romm-db

  romm-db:
    image: mariadb:10.11
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - romm_db_data:/var/lib/mysql

volumes:
  romm_resources:
  romm_redis_data:
  romm_db_data:
